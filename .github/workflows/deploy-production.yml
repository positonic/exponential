name: Deploy production

# Builds the app here and uploads the finished output to Vercel, instead of
# letting Vercel's Git integration rebuild every merge on its own machines.
#
# Why: the Tests workflow already builds every PR on GitHub's runners (free —
# this repo is public), and then Vercel built the same commit again at
# $0.028/min on an "enhanced" build machine. Build CPU minutes were 78% of
# the project's Q3 2026 Vercel bill. `vercel deploy --prebuilt` bills no
# build minutes, so this moves the production build onto the free side.
#
# vercel.json sets git.deploymentEnabled.main = false so the Git integration
# no longer deploys main itself — otherwise every merge would deploy twice.
# `develop` (staging) still deploys through the Git integration.
#
# Needs the VERCEL_TOKEN repository secret: Vercel → Account → Tokens, scoped
# to the ground-zero-labs team. VERCEL_ORG_ID / VERCEL_PROJECT_ID below are
# identifiers, not secrets (they are the contents of .vercel/project.json).
#
# To redeploy main without a new commit, run this workflow from the Actions
# tab (workflow_dispatch) — the dashboard's "Redeploy" button rebuilds from
# Git, which this project no longer does for main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue, don't cancel: merges land in bursts and every one should reach
# production in order. A cancelled run would skip a commit.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_FLuQ5niFRGqEt3VPuTIXt7hg
  VERCEL_PROJECT_ID: prj_OI1WttXzLtNWlVTcszGDEshTkiNl
  VERCEL_CLI: vercel@48
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check VERCEL_TOKEN is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "${VERCEL_TOKEN}" ]]; then
            echo "::error::VERCEL_TOKEN repository secret is not set. Production is NOT deploying — add the secret (see the header comment in this workflow) and re-run."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Vercel's project setting is Node 22.x; build with the same major so the
      # output matches what the Git integration produced.
      - uses: ./.github/actions/npm-install
        with:
          node-version: '22'

      # Same key scheme as cache-warm.yml and the Build job in test.yml, so
      # the compiler cache carries over between runs on main.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'content/**', 'next.config.js', 'tailwind.config.ts', 'postcss.config.js', 'tsconfig.json', 'sentry.*.config.ts') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Fetches the project settings and the production environment variables
      # into .vercel/, so `vercel build` sees exactly what a Vercel build would.
      - name: Pull Vercel project settings and env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # Replaces preview-smoke.yml, which listened for the Git integration's
      # deployment_status events; CLI deploys do not emit those. Probes the
      # real Vercel-runtime function so a crash that only happens on Vercel
      # (e.g. PR #100's DOMMatrix bug) fails this run instead of 500ing in
      # production unnoticed. The *.vercel.app deployment URL sits behind
      # Deployment Protection, hence the bypass header.
      - name: Smoke-test the deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]]; then
            echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET not set — skipping post-deploy probes of ${DEPLOYMENT_URL}"
            exit 0
          fi
          probes=(
            "tRPC auth.getConfiguredProviders|/api/trpc/auth.getConfiguredProviders?batch=1&input=%7B%220%22%3A%7B%22json%22%3Anull%7D%7D"
            "Landing page|/"
          )
          fail=0
          for probe in "${probes[@]}"; do
            IFS='|' read -r label path <<<"${probe}"
            status=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "${DEPLOYMENT_URL}${path}") || status=000
            if [[ "${status}" =~ ^[45] ]] || [[ "${status}" == "000" ]]; then
              echo "::error::${label} → HTTP ${status}"
              fail=1
            else
              echo "ok  ${label} → HTTP ${status}"
            fi
          done
          exit "${fail}"
