name: PR Agent (GLM)
#
# ⏸️  DEACTIVATED 2026-08-07 — this reviewer does not run on PRs.
#
# The OPENROUTER_API_KEY secret has no credits ("This account never purchased
# credits"), so every run reviewed nothing and — since PR 532 made a green tick
# mean a review actually happened — reported that honestly as a red check on
# every PR. A permanently red check that no one can act on is noise, so the
# reviewer is parked until the key is funded rather than left failing.
#
# TO REACTIVATE: buy OpenRouter credits, then restore the trigger below to
#
#   on:
#     pull_request:
#       types: [opened, reopened, ready_for_review, synchronize]
#
# The job body below is untouched, so that is the only edit needed to bring it
# back. Do not assume the rest is proven, though: this reviewer never completed
# a successful run, so the credit balance is the only fault we have actually
# observed. Anything downstream of the first model call — the GLM model id, the
# 200k token ceiling, the non-persistent comment settings — is written but
# unverified. Watch the first run after reactivating.
#
# Note this check is NOT in main's required set, so parking it does not block
# any merge.
#
# WHAT IT WAS: a second automated reviewer — the same qodo-ai/pr-agent action as
# pr_agent.yml, pointed at GLM via OpenRouter instead of Anthropic. Two
# independent readers applying the same house rules from .pr_agent.toml.
# pr_agent.yml (Anthropic) is unaffected and remains the active reviewer.
# It deliberately carried no `issue_comment` trigger (unlike pr_agent.yml), so
# that manual `/review` commands reached one reviewer rather than both — keep
# that in mind when restoring the trigger block.
on:
  # Placeholder trigger: a workflow needs one, and this keeps the file valid and
  # visible in the Actions tab while it is parked. Dispatching it by hand does
  # NOT produce a review — the action needs a pull_request event for context.
  workflow_dispatch:
jobs:
  pr_agent_glm_job:
    # Skip bot-triggered events so the two reviewers can't set each other off.
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: PR Agent review (GLM)
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: PR Agent action step
        id: pragent_glm
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dotted, matching ANTHROPIC.KEY in pr_agent.yml — the action maps
          # env vars to settings by literal dot, not by dunder.
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # These env vars override the repo-root .pr_agent.toml, which is read
          # by BOTH workflows. Anything that must differ per reviewer belongs
          # here, not in that file.
          config.model: "openrouter/z-ai/glm-5.2"
          config.fallback_models: '["openrouter/z-ai/glm-4.7"]'
          # GLM is not in litellm's registry under this name; without an
          # explicit ceiling, token counting fails before the first call.
          config.custom_model_max_tokens: "200000"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
          # Off deliberately: pr_agent.yml already rewrites the PR body, and two
          # agents writing the same description means last-writer-wins.
          github_action_config.auto_describe: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          # Off deliberately: PR-Agent finds its persistent comment by matching
          # the body prefix, with no per-instance marker and no lock. Left on,
          # this reviewer would update the Anthropic reviewer's comment in place
          # instead of posting its own.
          pr_reviewer.persistent_comment: "false"
          pr_code_suggestions.persistent_comment: "false"

      - name: Confirm a review was actually produced
        # See the same step in pr_agent.yml for why this exists. This reviewer
        # has its own failure mode: as of PR 530 the OpenRouter key reported
        # "Insufficient credits. This account never purchased credits" — i.e.
        # this second opinion had never once run, and nothing said so.
        if: always() && steps.pragent_glm.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR number on this event; nothing to verify."
            exit 0
          fi
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.created_at >= \"${SINCE}\") | .body] | .[]" \
            > /tmp/pr_agent_glm_comments.txt
          if grep -qiE 'failed to (generate|review)' /tmp/pr_agent_glm_comments.txt; then
            echo "::error title=PR-Agent (GLM) produced no review::The action ran but every model call failed, so this PR was NOT reviewed. Check the step log for the provider error — it is usually an exhausted credit balance on the OPENROUTER_API_KEY secret."
            grep -iE 'failed to (generate|review)' /tmp/pr_agent_glm_comments.txt | head -5
            exit 1
          fi
          echo "PR-Agent (GLM) posted no failure notice — the review ran."
