name: Tests

# PR-only on purpose. PRs are squash-merged only after every required check has
# passed on the PR itself, so re-running the suite on `push` to main repeated
# work that had already passed. Branch protection has `strict: false`, so a PR
# can merge without being rebased on the latest main and two PRs could in theory
# conflict semantically; in the 30 days to 2026-10-10 (228 push runs) that never
# happened — all 7 push failures were the next/font Google Fonts fetch flake,
# fixed by vendoring the font. `Build` also wouldn't catch a type-level conflict
# (next.config sets typescript.ignoreBuildErrors). The only typecheck in CI is
# `Lint & Typecheck`, which runs on the PR.
on:
  pull_request:
    branches: [main, develop]

# A new push to a PR cancels that PR's still-running suite: only the newest
# commit can be merged, so the older run's verdict is worthless and its
# job-minutes are wasted. The gate (pr-agent-automerge.yml) only acts on
# workflow_run events whose conclusion is `success`, so a cancelled run never
# reaches it. cancel-in-progress is gated on the event name so that if a
# non-PR trigger is ever added again, runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: true
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - run: npx tsc --noEmit
      - run: npx next lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - run: npm run test
        env:
          SKIP_ENV_VALIDATION: true
          AUTH_SECRET: test-secret-for-ci

  # Docs guardrails: every /docs link and #anchor resolves, every /doc-assets
  # image exists, "**Label** in the sidebar" names a real sidebar item or
  # settings tab, and every page has frontmatter + a last-updated entry.
  # See scripts/check-docs.ts and dev-docs/DOCS_STYLE_GUIDE.md.
  docs-check:
    name: Docs links & labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - run: npm run docs:check

  # The Tauri shell's Rust tests. Worth its own job rather than being left to
  # whoever remembers to run `cargo test` locally: the wiki commands are
  # reachable from a remote page, so the path-jail tests here are the thing
  # standing between a model-supplied path and the user's filesystem. They are
  # dependency-free (temp dirs and the git binary, which the runner has), so the
  # job is cheap.
  #
  # Only runs when src-tauri changes — most PRs never touch it, and the Rust
  # toolchain plus a cold cargo build is minutes.
  tauri-tests:
    name: Tauri (Rust) Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        name: Did anything in src-tauri change?
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -q '^src-tauri/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.changed == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.changed == 'true'
        with:
          workspaces: src-tauri
      - name: cargo test
        if: steps.changes.outputs.changed == 'true'
        working-directory: src-tauri
        run: cargo test

  # Dedicated merge gate: apply every migration from scratch against a real
  # Postgres. Fails the PR (once required in branch protection) if any migration
  # errors — bad SQL, a reference to a not-yet-created column, ordering drift, or
  # a checksum mismatch on an edited already-applied migration.
  #
  # Runs UNCONDITIONALLY on every PR (not path-filtered) so it is a reliable
  # required status check — a path-filtered required check that gets skipped
  # shows as "pending" and blocks merge forever. Applying the full history to an
  # empty DB takes only a few seconds.
  #
  # COVERAGE LIMIT: this applies migrations to an EMPTY database, so it catches
  # STRUCTURAL failures but NOT data-dependent ones (a data backfill that only
  # trips on real rows — e.g. an ON CONFLICT dup that needs an existing row).
  # Write data migrations defensively (dedupe before INSERT ... ON CONFLICT,
  # guard against NULLs, etc.); an empty-DB apply cannot prove them safe on prod.
  migration-apply:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: exponential_migrations
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5434/exponential_migrations
      SKIP_ENV_VALIDATION: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - name: Apply all migrations from scratch
        run: npx prisma migrate deploy
      - name: Verify no pending migrations / drift
        run: npx prisma migrate status

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: exponential_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/exponential_test
      DATABASE_URL_TEST: postgresql://test:test@localhost:5433/exponential_test
      SKIP_ENV_VALIDATION: true
      AUTH_SECRET: test-secret-for-ci
      CI: true
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: true
      # Dummy env vars for modules that check at build/import time.
      # No real API calls are made during build — these just prevent throws.
      AUTH_SECRET: build-secret
      OPENAI_API_KEY: sk-build-dummy
      AUTH_POSTMARK_KEY: build-dummy
      MASTRA_API_URL: http://localhost:4111
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install

      # Warm Next.js's compiler cache (.next/cache). Build sets the run's
      # wall-clock, and the webpack cache is the main lever on it. The exact
      # key hashes the lockfile plus the build inputs; the restore key falls
      # back to the newest cache for the same lockfile, so a PR reuses the
      # cache of whatever built last and only recompiles what changed.
      # next/font/local writes nothing here, but next/font/google used to
      # store fetched fonts in it — that fetch is gone (fonts are vendored),
      # not merely cached.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'content/**', 'next.config.js', 'tailwind.config.ts', 'postcss.config.js', 'tsconfig.json', 'sentry.*.config.ts') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm run build

      # Smoke-test the built artifact: boot `next start` and probe a handful
      # of routes. Catches the broad class of route-handler module-load
      # crashes that get past `next build` because building isn't running.
      # See scripts/smoketest.sh for the probe list. Note this won't catch
      # Vercel-runtime-specific crashes (e.g. PR #100's DOMMatrix bug) —
      # that's the job of preview-smoke.yml.
      - name: Smoke-test built server
        run: npm run smoketest
        env:
          SKIP_ENV_VALIDATION: true
          AUTH_SECRET: smoke-secret
          DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke
          AUTH_DISCORD_ID: smoke-discord-id
          AUTH_DISCORD_SECRET: smoke-discord-secret
          OPENAI_API_KEY: sk-smoke-dummy
          AUTH_POSTMARK_KEY: smoke-dummy
          MASTRA_API_URL: http://localhost:4111
