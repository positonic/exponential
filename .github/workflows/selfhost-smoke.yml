# Self-host smoke test: boot the Docker Compose stack the way an operator
# would, sign in through the real HTTP surface, and check the scheduler ticks.
#
# What it proves, end to end, on a clean runner:
#   - `docker compose up` builds the app and scheduler images and starts
#     Postgres (pgvector), secrets-init, the app and the scheduler with NO
#     environment at all: no LLM key, no email transport, no secrets
#   - the app applies its migrations and answers /api/health
#   - sign-in works with a log-delivered code (CSRF -> POST signin ->
#     code from `docker compose logs app` -> callback -> /api/auth/session)
#   - the scheduler's agent-runs tick gets a 200 from the app
#   - after `down` / `up`, the generated secrets are kept and the session from
#     before the restart is still signed in
# scripts/selfhost/composeSmoke.ts does the checking; it runs the same way
# locally (see its header).
#
# Mastra (the `assistant` profile) is not booted here: it is optional, and it
# builds from another repo (positonic/mastra), which has its own boot check.
#
# NEVER A REQUIRED CHECK. It is path-filtered on pull requests, and a
# path-filtered required check that is skipped stays "pending" forever and
# blocks the merge (see the migration-apply comment in test.yml). It exists to
# catch the self-host path regressing, not to gate merges: a failed nightly
# run opens (or comments on) a GitHub issue instead, and the next passing
# nightly run closes it.
#
# No secret appears here and none is needed: the repo is public, the stack
# generates its own secrets, and no LLM key is set (AI features switch off).
#
# Memory: building the app image needs about 10 GB (Next build; OOM-killed at
# 8 GB, see the Dockerfile). GitHub-hosted ubuntu-latest runners for public
# repositories have 4 vCPUs and 16 GB, which fits. Do not move this job to a
# smaller runner. A cold build takes roughly 10-15 minutes; nothing is cached
# between runs, and no image is pushed anywhere.
name: Self-host smoke

on:
  schedule:
    - cron: "30 3 * * *" # nightly, 03:30 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "docker-compose.yml"
      - "scripts/selfhost/**"
      - "src/env.js"
      - "src/server/auth/**"
      - "src/server/services/EmailService.ts"
      - "src/lib/urls.ts"
      - "src/lib/signInCode.ts"
      - "src/app/api/health/**"
      - "src/app/api/cron/agent-runs/**"
      - "vercel.json"
      - ".github/workflows/selfhost-smoke.yml"

concurrency:
  group: selfhost-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Only the nightly run uses it: to open or close the failure issue.
  issues: write

env:
  COMPOSE_PROJECT_NAME: selfhost-smoke
  APP_PORT: "3000"
  SMOKE_STATE_DIR: ${{ github.workspace }}/.selfhost-smoke-state
  # tsx at the version package-lock.json resolves; the smoke script needs no
  # npm install (it imports only Node builtins and src/lib/signInCode.ts).
  TSX_VERSION: "4.21.0"
  ISSUE_TITLE: "Nightly self-host smoke test is failing"
  # gh needs the repository for issue calls; set it explicitly rather than
  # relying on the checkout's git remote.
  GH_REPO: ${{ github.repository }}

jobs:
  smoke:
    name: Compose stack boots and signs in
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The app image (full node_modules plus the Next build) and its build
      # layers need more disk than a fresh runner leaves free. These toolchains
      # are unused here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build images
        run: docker compose build

      - name: Start the stack (no LLM key, no email transport, no secrets)
        run: docker compose up -d

      - name: First boot - health, sign-in, scheduler tick
        run: npx --yes "tsx@${TSX_VERSION}" scripts/selfhost/composeSmoke.ts first-boot

      - name: Restart with volumes kept
        run: |
          docker compose down
          docker compose up -d

      - name: Restart - secrets kept, session still valid
        run: npx --yes "tsx@${TSX_VERSION}" scripts/selfhost/composeSmoke.ts restart

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 300

      # A failed nightly run opens one issue and comments on it after that, the
      # way exponential-auth-canary.yml does: a new issue every night would be
      # ignored. Pull requests show their failure on the PR instead.
      - name: Raise the alarm
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --state open --limit 50 \
            --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')

          BODY=$(cat <<EOF
          The nightly self-host smoke test failed: \`docker compose up\` with no
          settings, then sign-in with a log-delivered code, the scheduler's
          agent-runs tick, and a restart that must keep the generated secrets.

          Self-host installs (Docker Compose, and the Railway template, which
          builds the same images) may be broken on \`main\`. The failing step
          and the stack's logs are in the run.

          Reproduce locally with the commands in the header of
          \`scripts/selfhost/composeSmoke.ts\`.

          [Smoke run log]($RUN_URL)
          EOF
          )

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Commented on existing issue $EXISTING"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$BODY"
          fi

      # Close the alarm once a nightly run passes again.
      - name: Stand down
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --state open --limit 50 \
            --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "The nightly self-host smoke test passes again."
          fi

      - name: Tear down
        if: always()
        run: docker compose down -v --rmi local
