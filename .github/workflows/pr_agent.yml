name: PR Agent
#
# Review-only on GLM 5.3 through OpenRouter, pinned to Z.AI's own endpoint (the
# model, fallback and routing live in .pr_agent.toml). This check is not
# required on main, but pr-agent-automerge.yml listens for this workflow by
# name — keep `name: PR Agent` and the job name `PR Agent review`.
#
# Moved off Claude Opus 5 on 2026-10-11. Opus ran describe + review + improve
# on every push: 4 calls, about $0.75 a push, so $100 of credit lasted three
# days (Oct 8–11), and the August key had drained the same way. One review
# call on GLM 5.3 is roughly $0.06. Describe is off because sessions write
# their own PR bodies; improve is off because its suggestions never scored
# above 7 here and the gate no longer reads them.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
jobs:
  pr_agent_job:
    # Skip when the event was triggered by a bot (e.g. PR-Agent's own comments)
    # to avoid an infinite review loop, and skip comments on non-PR issues.
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name != 'issue_comment' || github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: PR Agent review
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Model, fallback and provider routing are in .pr_agent.toml, not here:
          # PR-Agent applies the repo file after these env vars, so a model set
          # here is silently overridden by the one in the file.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'

      - name: Confirm a review was actually produced
        # PR-Agent swallows provider errors. It posts "Failed to generate code
        # suggestions for PR" as a PR comment and still exits 0, so without this
        # the job goes green having reviewed nothing — which is worse than no
        # reviewer at all, because the tick reads as "a reviewer looked at this".
        # Seen for real on PR 530: the Anthropic key was out of credit, the job
        # was green, and four failure notices sat unread on the PR.
        #
        # This check is not in branch protection's required set, so a red tick
        # here reports the outage without blocking anyone's merge.
        if: always() && steps.pragent.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR number on this event; nothing to verify."
            exit 0
          fi
          # Only comments from this run — otherwise one bad run would keep the
          # check red on every later push to the same PR.
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.created_at >= \"${SINCE}\") | .body] | .[]" \
            > /tmp/pr_agent_comments.txt
          if grep -qiE 'failed to (generate|review)' /tmp/pr_agent_comments.txt; then
            echo "::error title=PR-Agent produced no review::The action ran but every model call failed, so this PR was NOT reviewed. Check the step log for the provider error — it is usually an exhausted credit balance on the OPENROUTER_API_KEY secret."
            grep -iE 'failed to (generate|review)' /tmp/pr_agent_comments.txt | head -5
            exit 1
          fi
          echo "PR-Agent posted no failure notice — the review ran."
