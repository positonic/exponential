[package]
name = "exponential-beta"
version = "0.1.0"
description = "Exponential Beta — Tauri desktop shell (macOS foray build)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# `_lib` suffix keeps the library name from colliding with the binary on Windows;
# the Tauri v2 template convention, kept so `cargo tauri` tooling stays happy.
name = "exponential_beta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PKCE: 32 random bytes → base64url verifier, S256 challenge.
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
tauri-plugin-store = "2.4.4"

[profile.dev]
# The shell is a thin wrapper around a remote page; incremental debug builds are
# what we actually iterate on, so keep them cheap.
incremental = true
